<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="t d"><title id="t">ReflectiveEquilibrium.AI candidate representation</title><desc id="d">A web-native schematic showing a scenario with public, expert, and framework policy candidates before execution.</desc><rect width="1400" height="860" fill="#f7f8fa"/><rect x="55" y="45" width="1290" height="770" rx="22" fill="#fff" stroke="#d9dde3"/><rect x="55" y="45" width="1290" height="72" rx="22" fill="#171716"/><circle cx="92" cy="81" r="8" fill="#ff6b6b"/><circle cx="118" cy="81" r="8" fill="#ffd166"/><circle cx="144" cy="81" r="8" fill="#06d6a0"/><text x="185" y="88" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">ReflectiveEquilibrium.AI</text><text x="1240" y="88" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#c7c7c7">SACRE workspace</text><g font-family="Arial,sans-serif"><text x="95" y="165" font-size="14" font-weight="700" fill="#6d4aff">SCENARIO</text><rect x="95" y="185" width="1210" height="112" rx="12" fill="#f4f2ed" stroke="#e2dfd8"/><text x="120" y="225" font-size="18" font-weight="700" fill="#181817">Policy question</text><text x="120" y="258" font-size="15" fill="#66635e">A decision is represented together with candidate policies drawn from different normative sources.</text><text x="95" y="350" font-size="14" font-weight="700" fill="#6d4aff">POLICY CANDIDATES</text><rect x="95" y="372" width="370" height="315" rx="14" fill="#eaf3fb" stroke="#bfd5ea"/><text x="120" y="414" font-size="13" font-weight="700" fill="#185fa5">PUBLIC</text><text x="120" y="452" font-size="18" font-weight="700" fill="#181817">Candidate P1</text><text x="120" y="486" font-size="14" fill="#516575">Affected-person or public</text><text x="120" y="511" font-size="14" fill="#516575">preference represented as</text><text x="120" y="536" font-size="14" fill="#516575">an explicit policy option.</text><rect x="120" y="590" width="128" height="34" rx="17" fill="#fff" stroke="#bfd5ea"/><text x="184" y="612" text-anchor="middle" font-size="12" fill="#185fa5">source-tagged</text><rect x="515" y="372" width="370" height="315" rx="14" fill="#e8f4ef" stroke="#b9d9cd"/><text x="540" y="414" font-size="13" font-weight="700" fill="#0f6e56">EXPERT</text><text x="540" y="452" font-size="18" font-weight="700" fill="#181817">Candidate P2</text><text x="540" y="486" font-size="14" fill="#4f6a61">Professional, institutional,</text><text x="540" y="511" font-size="14" fill="#4f6a61">or scientific judgment encoded</text><text x="540" y="536" font-size="14" fill="#4f6a61">as a comparable policy.</text><rect x="540" y="590" width="128" height="34" rx="17" fill="#fff" stroke="#b9d9cd"/><text x="604" y="612" text-anchor="middle" font-size="12" fill="#0f6e56">source-tagged</text><rect x="935" y="372" width="370" height="315" rx="14" fill="#fbf2df" stroke="#ead4a5"/><text x="960" y="414" font-size="13" font-weight="700" fill="#a8660b">FRAMEWORK</text><text x="960" y="452" font-size="18" font-weight="700" fill="#181817">Candidate P3</text><text x="960" y="486" font-size="14" fill="#755a2f">An ethical principle, theory,</text><text x="960" y="511" font-size="14" fill="#755a2f">or framework generates a</text><text x="960" y="536" font-size="14" fill="#755a2f">third comparison candidate.</text><rect x="960" y="590" width="128" height="34" rx="17" fill="#fff" stroke="#ead4a5"/><text x="1024" y="612" text-anchor="middle" font-size="12" fill="#a8660b">source-tagged</text><rect x="95" y="722" width="1210" height="54" rx="12" fill="#f1edff" stroke="#d7ccff"/><text x="120" y="755" font-size="14" font-weight="700" fill="#6d4aff">NEXT → execute pairwise convergence, aggregate, rank, preserve provenance, and iterate</text></g></svg>