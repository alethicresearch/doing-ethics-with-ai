<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">DEWA Paradigm and Domain Realizations</title><desc id="d">Doing Ethics with AI as a general paradigm with computational bioethics, computational law, computational business ethics, and other domains.</desc>
<rect width="1600" height="1000" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:35px;font-weight:800;letter-spacing:1px}.white{fill:#fff}.h1{font-size:48px;font-weight:800}.h2{font-size:27px;font-weight:700}.sub{font-size:21px;font-weight:600}.body{font-size:19px}.small{font-size:17px}.box{fill:#fff;stroke-width:2}.note{font-size:24px;font-weight:700;fill:#0b2d6b}</style>
<text x="800" y="48" text-anchor="middle" class="title" fill="#0b2d6b">FIGURE 1.  DEWA PARADIGM AND DOMAIN REALIZATIONS</text>
<rect x="300" y="72" width="1000" height="165" rx="14" fill="#0b2d6b"/>
<text x="800" y="125" text-anchor="middle" class="h1 white">DEWA</text><text x="800" y="165" text-anchor="middle" class="h2 white">Doing Ethics with AI</text>
<text x="800" y="202" text-anchor="middle" class="sub white" font-style="italic">Practical Ethics Engineering  •  Product-Led Philosophy  •  Normative Computation  •  Computer-Aided Ethics</text>
<rect x="300" y="250" width="1000" height="70" rx="12" fill="#f4f7fb" stroke="#1d4ed8" stroke-width="2"/><text x="800" y="280" text-anchor="middle" class="sub" fill="#0b2d6b">A general paradigm for specifying, building, testing, and deploying</text><text x="800" y="307" text-anchor="middle" class="sub" fill="#0b2d6b">computer-aided ethics systems.</text>
<path d="M800 320v30M210 350h1180M210 350v35M605 350v35M995 350v35M1390 350v35" fill="none" stroke="#111" stroke-width="3"/>
<g><rect class="box" x="70" y="385" width="300" height="225" rx="14" fill="#f1f8f1" stroke="#176b2c"/><text x="220" y="430" text-anchor="middle" class="h2" fill="#176b2c">Computational</text><text x="220" y="462" text-anchor="middle" class="h2" fill="#176b2c">Bioethics</text><text x="220" y="510" text-anchor="middle" class="body">health, life sciences, medicine,</text><text x="220" y="538" text-anchor="middle" class="body">biomedicine, research ethics,</text><text x="220" y="566" text-anchor="middle" class="body">public health, environment</text>
<rect class="box" x="455" y="385" width="300" height="225" rx="14" fill="#f7f4ff" stroke="#5b3fb5"/><text x="605" y="430" text-anchor="middle" class="h2" fill="#5b3fb5">Computational</text><text x="605" y="462" text-anchor="middle" class="h2" fill="#5b3fb5">Law</text><text x="605" y="510" text-anchor="middle" class="body">law, justice, regulation, policy</text><text x="605" y="538" text-anchor="middle" class="body">analysis, adjudication,</text><text x="605" y="566" text-anchor="middle" class="body">legal reasoning</text>
<rect class="box" x="845" y="385" width="300" height="225" rx="14" fill="#fff8e9" stroke="#c48806"/><text x="995" y="430" text-anchor="middle" class="h2" fill="#9a6700">Computational</text><text x="995" y="462" text-anchor="middle" class="h2" fill="#9a6700">Business Ethics</text><text x="995" y="510" text-anchor="middle" class="body">compliance, auditing, ESG,</text><text x="995" y="538" text-anchor="middle" class="body">governance, responsible business,</text><text x="995" y="566" text-anchor="middle" class="body">stakeholder ethics</text>
<rect class="box" x="1230" y="385" width="300" height="225" rx="14" fill="#f7f7f7" stroke="#9ca3af"/><text x="1380" y="430" text-anchor="middle" class="h2" fill="#4b5563">Other</text><text x="1380" y="462" text-anchor="middle" class="h2" fill="#4b5563">Domains</text><text x="1380" y="518" text-anchor="middle" class="body">education • public policy</text><text x="1380" y="546" text-anchor="middle" class="body">environment • AI ethics</text><text x="1380" y="574" text-anchor="middle" class="body">and other areas</text></g>
<g><rect x="70" y="640" width="300" height="165" rx="12" fill="#f7fbf7" stroke="#176b2c"/><text x="95" y="680" class="small">• SACRE — normative specification</text><text x="95" y="716" class="small">• RE.AI — implemented system</text><text x="95" y="752" class="small">• Bioethics Bench — research resource</text><text x="95" y="788" class="small">• Health / biomedicine deployments</text>
<rect x="455" y="640" width="300" height="165" rx="12" fill="#fbfaff" stroke="#5b3fb5"/><text x="480" y="680" class="small">• Precedents, statutes</text><text x="480" y="716" class="small">• Duties, rights, remedies</text><text x="480" y="752" class="small">• Standards interpretation</text><text x="480" y="788" class="small">• Legal decision support</text>
<rect x="845" y="640" width="300" height="165" rx="12" fill="#fffaf0" stroke="#c48806"/><text x="870" y="680" class="small">• Standards &amp; policies</text><text x="870" y="716" class="small">• Risk &amp; impact analysis</text><text x="870" y="752" class="small">• Stakeholder evaluation</text><text x="870" y="788" class="small">• Ethical decision support</text>
<rect x="1230" y="640" width="300" height="165" rx="12" fill="#fafafa" stroke="#9ca3af"/><text x="1255" y="680" class="small">• Education</text><text x="1255" y="716" class="small">• Public policy</text><text x="1255" y="752" class="small">• Environment</text><text x="1255" y="788" class="small">• Other domains</text></g>
<rect x="270" y="840" width="1060" height="88" rx="12" fill="#f4f7fb" stroke="#1d4ed8" stroke-width="2"/><text x="800" y="876" text-anchor="middle" class="note">The DEWA paradigm can be realized across many domains that involve</text><text x="800" y="909" text-anchor="middle" class="note">normative reasoning, deliberation, and decision-making.</text>
</svg>