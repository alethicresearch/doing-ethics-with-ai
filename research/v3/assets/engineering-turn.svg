<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="t d"><title id="t">The engineering turn in practical ethics</title><desc id="d">A staged progression from normative ethics through practical and empirical ethics to practical ethics engineering.</desc><rect width="1400" height="620" fill="#fff"/><text x="80" y="82" font-family="Georgia,serif" font-size="34" fill="#181817">From philosophical analysis to engineered normative instruments</text><text x="80" y="122" font-family="Arial,sans-serif" font-size="18" fill="#66635e">A site schematic of the engineering turn described in P1</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#99958d"/></marker></defs><g font-family="Arial,sans-serif"><rect x="82" y="210" width="235" height="170" rx="18" fill="#f4f2ed" stroke="#d9d5cc"/><text x="200" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#181817">Normative ethics</text><text x="200" y="300" text-anchor="middle" font-size="15" fill="#66635e">principles</text><text x="200" y="327" text-anchor="middle" font-size="15" fill="#66635e">arguments</text><text x="200" y="354" text-anchor="middle" font-size="15" fill="#66635e">theories</text><path d="M317 295 H386" stroke="#99958d" stroke-width="3" marker-end="url(#a)"/><rect x="404" y="210" width="235" height="170" rx="18" fill="#eef5fb" stroke="#bfd5ea"/><text x="522" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#185fa5">Practical turn</text><text x="522" y="300" text-anchor="middle" font-size="15" fill="#516575">cases</text><text x="522" y="327" text-anchor="middle" font-size="15" fill="#516575">institutions</text><text x="522" y="354" text-anchor="middle" font-size="15" fill="#516575">decisions</text><path d="M639 295 H708" stroke="#99958d" stroke-width="3" marker-end="url(#a)"/><rect x="726" y="210" width="235" height="170" rx="18" fill="#e8f4ef" stroke="#b9d9cd"/><text x="844" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#0f6e56">Empirical turn</text><text x="844" y="300" text-anchor="middle" font-size="15" fill="#4f6a61">preferences</text><text x="844" y="327" text-anchor="middle" font-size="15" fill="#4f6a61">behavior</text><text x="844" y="354" text-anchor="middle" font-size="15" fill="#4f6a61">evidence</text><path d="M961 295 H1030" stroke="#99958d" stroke-width="3" marker-end="url(#a)"/><rect x="1048" y="190" width="270" height="210" rx="20" fill="#f1edff" stroke="#cbbfff" stroke-width="2"/><text x="1183" y="245" text-anchor="middle" font-size="18" font-weight="700" fill="#6d4aff">Engineering turn</text><text x="1183" y="286" text-anchor="middle" font-size="15" fill="#55438e">specify methods</text><text x="1183" y="315" text-anchor="middle" font-size="15" fill="#55438e">construct systems</text><text x="1183" y="344" text-anchor="middle" font-size="15" fill="#55438e">design interfaces</text><text x="1183" y="373" text-anchor="middle" font-size="15" fill="#55438e">deploy &amp; investigate</text></g><path d="M1183 400 C1183 500 930 520 705 520 C470 520 280 500 200 405" fill="none" stroke="#6d4aff" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"/><text x="705" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#6d4aff">construction and use feed back into philosophical understanding</text></svg>