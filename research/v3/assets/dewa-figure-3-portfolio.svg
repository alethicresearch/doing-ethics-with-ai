<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 980" role="img" aria-labelledby="t d">
<title id="t">DEWA Research and Publication Program</title><desc id="d">Core DEWA papers P1 through P5+, parallel major publications Alethic-ISM, Bioethics Bench, and Computational Bioethics, and later deployment papers.</desc>
<rect width="1700" height="980" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:43px;font-weight:800}.sub{font-size:19px}.band{font-size:22px;font-weight:800}.code{font-size:26px;font-weight:800}.head{font-size:18px;font-weight:800}.body{font-size:16px}.italic{font-size:16px;font-style:italic}.box{fill:#fff;stroke:#111;stroke-width:2.5}.smallbox{fill:#fff;stroke:#111;stroke-width:2}.rule{font-size:18px;font-weight:800}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38a4e8" stroke="#111" stroke-width=".6"/></marker></defs>
<text x="850" y="55" text-anchor="middle" class="title">DEWA Research and Publication Program</text><text x="850" y="90" text-anchor="middle" class="sub">Core cumulative series + parallel infrastructure/resource/domain papers + later deployment studies</text>
<text x="850" y="160" text-anchor="middle" class="band">CORE DEWA SERIES — one cumulative research spine</text>
<g><rect class="box" x="45" y="190" width="275" height="140" rx="9"/><text x="183" y="235" text-anchor="middle" class="code">P1</text><text x="183" y="272" text-anchor="middle" class="head">Doing Ethics with AI</text><text x="183" y="310" text-anchor="middle" class="body">Specify / field-build</text>
<rect class="box" x="385" y="190" width="275" height="140" rx="9"/><text x="523" y="235" text-anchor="middle" class="code">P2</text><text x="523" y="272" text-anchor="middle" class="head">Building Normative Computation</text><text x="523" y="310" text-anchor="middle" class="body">Build / investigate</text>
<rect class="box" x="725" y="190" width="275" height="140" rx="9"/><text x="863" y="235" text-anchor="middle" class="code">P3</text><text x="863" y="272" text-anchor="middle" class="head">Computational Validation</text><text x="863" y="310" text-anchor="middle" class="body">Technical validation</text>
<rect class="box" x="1065" y="190" width="275" height="140" rx="9"/><text x="1203" y="235" text-anchor="middle" class="code">P4</text><text x="1203" y="272" text-anchor="middle" class="head">Human Empirical &amp; Comparative Validation</text><text x="1203" y="310" text-anchor="middle" class="body">Human / comparative validation</text>
<rect class="box" x="1405" y="190" width="250" height="140" rx="9"/><text x="1530" y="235" text-anchor="middle" class="code">P5+</text><text x="1530" y="272" text-anchor="middle" class="head">Programmatic Deployments</text><text x="1530" y="310" text-anchor="middle" class="body">Deploy / study use</text>
<path d="M320 260h60M660 260h60M1000 260h60M1340 260h60" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/></g>
<text x="850" y="390" text-anchor="middle" class="band">PARALLEL MAJOR PUBLICATIONS — scientifically independent, coordinated with the core series</text>
<g><rect class="box" x="105" y="425" width="440" height="150" rx="9"/><text x="325" y="468" text-anchor="middle" class="code" font-size="23">Alethic-ISM</text><text x="325" y="510" text-anchor="middle" class="body">General instruction-state-machine infrastructure</text><text x="325" y="548" text-anchor="middle" class="italic">Standalone systems / workflows paper</text>
<rect class="box" x="630" y="425" width="440" height="150" rx="9"/><text x="850" y="468" text-anchor="middle" class="code" font-size="23">Bioethics Bench</text><text x="850" y="510" text-anchor="middle" class="body">Source-grounded computational bioethics research resource</text><text x="850" y="548" text-anchor="middle" class="italic">Standalone resource / benchmark paper</text>
<rect class="box" x="1155" y="425" width="440" height="150" rx="9"/><text x="1375" y="468" text-anchor="middle" class="code" font-size="23">Computational Bioethics</text><text x="1375" y="510" text-anchor="middle" class="body">Domain realization of DEWA in bioethics</text><text x="1375" y="548" text-anchor="middle" class="italic">Handbook / domain synthesis</text>
<path d="M523 330L325 425M523 330L850 425" stroke="#111" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a)"/></g>
<text x="850" y="650" text-anchor="middle" class="band">LATER APPLICATION / DERIVATIVE PAPERS — generated by actual deployments, new domains, and accumulated evidence</text>
<g><rect class="smallbox" x="55" y="690" width="360" height="95" rx="8"/><text x="235" y="748" text-anchor="middle" class="body">Institutional implementation studies</text><rect class="smallbox" x="455" y="690" width="360" height="95" rx="8"/><text x="635" y="748" text-anchor="middle" class="body">Review-board / governance studies</text><rect class="smallbox" x="855" y="690" width="360" height="95" rx="8"/><text x="1035" y="748" text-anchor="middle" class="body">Healthcare &amp; biomedical applications</text><rect class="smallbox" x="1255" y="690" width="390" height="95" rx="8"/><text x="1450" y="748" text-anchor="middle" class="body">Other DEWA domains — law, business ethics, policy, etc.</text></g>
<text x="850" y="875" text-anchor="middle" class="rule">Governing rule: P1–P4 remain self-contained. Parallel papers deepen infrastructure/resources; P5+ papers follow evidence from real use.</text>
</svg>