<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 980" role="img" aria-labelledby="t d">
<title id="t">DEWA Research and Publication Program</title><desc id="d">Core DEWA papers P1 through P4+, parallel major publications Alethic-ISM, Bioethics Bench, and Computational Bioethics, and later deployment papers. P1 now incorporates the construction and deployment demonstration previously separated as P2.</desc>
<rect width="1700" height="980" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:43px;font-weight:800}.sub{font-size:19px}.band{font-size:22px;font-weight:800}.code{font-size:26px;font-weight:800}.head{font-size:18px;font-weight:800}.body{font-size:16px}.italic{font-size:16px;font-style:italic}.box{fill:#fff;stroke:#111;stroke-width:2.5}.smallbox{fill:#fff;stroke:#111;stroke-width:2}.rule{font-size:18px;font-weight:800}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38a4e8" stroke="#111" stroke-width=".6"/></marker></defs>
<text x="850" y="55" text-anchor="middle" class="title">DEWA Research and Publication Program</text><text x="850" y="90" text-anchor="middle" class="sub">Core cumulative thesis/publication spine + parallel infrastructure/resource/domain papers + later deployment studies</text>
<text x="850" y="160" text-anchor="middle" class="band">CORE DEWA SERIES — one cumulative research spine</text>
<g><rect class="box" x="70" y="190" width="355" height="150" rx="9"/><text x="248" y="232" text-anchor="middle" class="code">P1</text><text x="248" y="270" text-anchor="middle" class="head">Doing Ethics with AI</text><text x="248" y="303" text-anchor="middle" class="body">Field-build / specify / construct / deploy</text><text x="248" y="326" text-anchor="middle" class="italic">SACRE + QCS/QCCS + ReflectiveEquilibrium.AI</text>
<rect class="box" x="495" y="190" width="355" height="150" rx="9"/><text x="673" y="232" text-anchor="middle" class="code">P2</text><text x="673" y="270" text-anchor="middle" class="head">Computational Validation</text><text x="673" y="303" text-anchor="middle" class="body">Reliability / robustness / measurement</text><text x="673" y="326" text-anchor="middle" class="italic">models • representations • conv variants • ranking</text>
<rect class="box" x="920" y="190" width="355" height="150" rx="9"/><text x="1098" y="232" text-anchor="middle" class="code">P3</text><text x="1098" y="270" text-anchor="middle" class="head">Human Comparative Validation</text><text x="1098" y="303" text-anchor="middle" class="body">Human / computational comparison</text><text x="1098" y="326" text-anchor="middle" class="italic">matched frozen normative objects</text>
<rect class="box" x="1345" y="190" width="285" height="150" rx="9"/><text x="1488" y="232" text-anchor="middle" class="code">P4+</text><text x="1488" y="270" text-anchor="middle" class="head">Programmatic Deployments</text><text x="1488" y="303" text-anchor="middle" class="body">Prospective use / effects</text><text x="1488" y="326" text-anchor="middle" class="italic">real institutions and decisions</text>
<path d="M425 265h65M850 265h65M1275 265h65" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/></g>
<text x="850" y="395" text-anchor="middle" class="band">PARALLEL MAJOR PUBLICATIONS — scientifically independent, coordinated with the core series</text>
<g><rect class="box" x="105" y="430" width="440" height="160" rx="9"/><text x="325" y="473" text-anchor="middle" class="code" font-size="23">Alethic-ISM</text><text x="325" y="515" text-anchor="middle" class="body">General instruction-state-machine infrastructure</text><text x="325" y="548" text-anchor="middle" class="italic">Standalone systems / workflows paper</text><text x="325" y="572" text-anchor="middle" class="body">supports construction, provenance, replay, and scale</text>
<rect class="box" x="630" y="430" width="440" height="160" rx="9"/><text x="850" y="473" text-anchor="middle" class="code" font-size="23">Bioethics Bench</text><text x="850" y="515" text-anchor="middle" class="body">Source-grounded computational bioethics research resource</text><text x="850" y="548" text-anchor="middle" class="italic">Standalone resource / benchmark paper</text><text x="850" y="572" text-anchor="middle" class="body">standardized objects and tasks for P2 and P3</text>
<rect class="box" x="1155" y="430" width="440" height="160" rx="9"/><text x="1375" y="473" text-anchor="middle" class="code" font-size="23">Computational Bioethics</text><text x="1375" y="515" text-anchor="middle" class="body">Domain realization of DEWA in bioethics</text><text x="1375" y="548" text-anchor="middle" class="italic">Handbook / domain synthesis</text><text x="1375" y="572" text-anchor="middle" class="body">integrates methods, instruments, evidence, and use</text></g>
<text x="850" y="660" text-anchor="middle" class="band">LATER APPLICATION / DERIVATIVE PAPERS — generated by actual deployments, new domains, and accumulated evidence</text>
<g><rect class="smallbox" x="55" y="700" width="360" height="95" rx="8"/><text x="235" y="758" text-anchor="middle" class="body">Institutional implementation studies</text><rect class="smallbox" x="455" y="700" width="360" height="95" rx="8"/><text x="635" y="758" text-anchor="middle" class="body">Review-board / governance studies</text><rect class="smallbox" x="855" y="700" width="360" height="95" rx="8"/><text x="1035" y="758" text-anchor="middle" class="body">Healthcare &amp; biomedical applications</text><rect class="smallbox" x="1255" y="700" width="390" height="95" rx="8"/><text x="1450" y="758" text-anchor="middle" class="body">Other DEWA domains — law, business ethics, policy, etc.</text></g>
<text x="850" y="875" text-anchor="middle" class="rule">Governing rule: P1 establishes the research object; P2 and P3 validate it; P4+ studies validated systems in use.</text>
<text x="850" y="910" text-anchor="middle" class="sub">Construction once separated as P2 is now part of P1; the former validation and deployment questions therefore move forward one place.</text>
</svg>