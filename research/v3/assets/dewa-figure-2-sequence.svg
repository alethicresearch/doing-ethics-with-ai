<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">DEWA Core Research Sequence</title><desc id="d">P1 through P4+ as the cumulative research program after construction and deployment of SACRE and ReflectiveEquilibrium.AI were incorporated into P1. Alethic-ISM and Bioethics Bench are shown as supporting parallel contributions.</desc>
<rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:48px;font-weight:800}.sub{font-size:22px}.head{font-size:28px;font-weight:800}.body{font-size:19px}.small{font-size:18px}.italic{font-size:17px;font-style:italic}.main{fill:#fff;stroke:#111;stroke-width:3}.support{fill:#fff;stroke:#111;stroke-width:3;stroke-dasharray:9 6}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38a4e8" stroke="#111" stroke-width=".6"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">DEWA Core Research Sequence</text><text x="800" y="100" text-anchor="middle" class="sub">P1 establishes and constructs the research object; P2–P4+ test its computational, human, and practical performance</text>
<g><rect class="main" x="430" y="155" width="740" height="112" rx="8"/><text x="800" y="195" text-anchor="middle" class="head">P1 — DOING ETHICS WITH AI</text><text x="800" y="229" text-anchor="middle" class="body">Field-build • specify • construct • deploy</text><text x="800" y="253" text-anchor="middle" class="small">Practical ethics engineering • SACRE • QCS/QCCS • ReflectiveEquilibrium.AI</text><path d="M800 269v38" stroke="#111" stroke-width="3" marker-end="url(#a)"/>
<rect class="main" x="430" y="315" width="740" height="112" rx="8"/><text x="800" y="355" text-anchor="middle" class="head">P2 — COMPUTATIONAL VALIDATION</text><text x="800" y="389" text-anchor="middle" class="body">Reliability • robustness • models/providers • representation • aggregation • ranking • RE-Iteration</text><text x="800" y="413" text-anchor="middle" class="small">QCCS protocol and scale variants, including conv⁺ / conv⁻ / conv±, become explicit test objects</text><path d="M800 429v38" stroke="#111" stroke-width="3" marker-end="url(#a)"/>
<rect class="main" x="430" y="475" width="740" height="112" rx="8"/><text x="800" y="515" text-anchor="middle" class="head">P3 — HUMAN COMPARATIVE VALIDATION</text><text x="800" y="549" text-anchor="middle" class="body">Human↔human • human↔model • matched frozen normative objects</text><text x="800" y="573" text-anchor="middle" class="small">Agreement, disagreement, reliability, representation effects, and downstream consequences</text><path d="M800 589v38" stroke="#111" stroke-width="3" marker-end="url(#a)"/>
<rect class="main" x="430" y="635" width="740" height="112" rx="8"/><text x="800" y="675" text-anchor="middle" class="head">P4+ — PROGRAMMATIC DEPLOYMENTS</text><text x="800" y="709" text-anchor="middle" class="body">Prospective computer-aided ethics in institutions and real decision processes</text><text x="800" y="733" text-anchor="middle" class="small">Use validation • reliance • governance • effects • practical outcomes</text></g>
<g><rect class="support" x="35" y="255" width="300" height="145" rx="8"/><text x="185" y="296" text-anchor="middle" class="head" font-size="25">Alethic-ISM</text><text x="185" y="329" text-anchor="middle" class="small">General technical infrastructure</text><text x="185" y="358" text-anchor="middle" class="small">Standalone systems/workflows paper</text><text x="185" y="387" text-anchor="middle" class="italic">provenance • replay • cross-workflow execution</text><path d="M335 327L430 371" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
<rect class="support" x="1265" y="338" width="300" height="145" rx="8"/><text x="1415" y="379" text-anchor="middle" class="head" font-size="25">Bioethics Bench</text><text x="1415" y="412" text-anchor="middle" class="small">Source-grounded research resource</text><text x="1415" y="441" text-anchor="middle" class="small">Standalone resource / benchmark paper</text><text x="1415" y="470" text-anchor="middle" class="italic">standardized objects / tasks for P2 and P3</text><path d="M1265 410L1170 371" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/></g>
<text x="800" y="830" text-anchor="middle" class="head" font-size="22">Solid arrows = thesis / core publication spine. Dashed arrows = enabling parallel contributions, not intermediate stages.</text>
</svg>