<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="t d">
<title id="t">DEWA Core Research Sequence</title><desc id="d">P1 through P5+ as the cumulative research program with Alethic-ISM and Bioethics Bench shown as supporting parallel contributions.</desc>
<rect width="1600" height="980" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:48px;font-weight:800}.sub{font-size:22px}.head{font-size:29px;font-weight:800}.body{font-size:20px}.small{font-size:18px}.italic{font-size:17px;font-style:italic}.main{fill:#fff;stroke:#111;stroke-width:3}.support{fill:#fff;stroke:#111;stroke-width:3;stroke-dasharray:9 6}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38a4e8" stroke="#111" stroke-width=".6"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">DEWA Core Research Sequence</text><text x="800" y="100" text-anchor="middle" class="sub">P1 → P2 → P3 → P4 → P5+ is the cumulative program; parallel contributions are not prerequisites</text>
<g><rect class="main" x="430" y="155" width="740" height="98" rx="8"/><text x="800" y="195" text-anchor="middle" class="head">P1 — SPECIFY</text><text x="800" y="228" text-anchor="middle" class="body">Normative computation + SACRE</text><path d="M800 255v38" stroke="#111" stroke-width="3" marker-end="url(#a)"/>
<rect class="main" x="430" y="300" width="740" height="98" rx="8"/><text x="800" y="340" text-anchor="middle" class="head">P2 — BUILD</text><text x="800" y="373" text-anchor="middle" class="body">SACRE → ReflectiveEquilibrium.AI</text><path d="M800 400v38" stroke="#111" stroke-width="3" marker-end="url(#a)"/>
<rect class="main" x="430" y="445" width="740" height="98" rx="8"/><text x="800" y="485" text-anchor="middle" class="head">P3 — COMPUTATIONAL VALIDATION</text><text x="800" y="518" text-anchor="middle" class="body">Reliability • robustness • models • representation • perturbation • RE-Iteration</text><path d="M800 545v38" stroke="#111" stroke-width="3" marker-end="url(#a)"/>
<rect class="main" x="430" y="590" width="740" height="98" rx="8"/><text x="800" y="630" text-anchor="middle" class="head">P4 — HUMAN EMPIRICAL / COMPARATIVE VALIDATION</text><text x="800" y="663" text-anchor="middle" class="body">Human↔human • human↔model • human↔system</text><path d="M800 690v38" stroke="#111" stroke-width="3" marker-end="url(#a)"/>
<rect class="main" x="430" y="735" width="740" height="98" rx="8"/><text x="800" y="775" text-anchor="middle" class="head">P5+ — DEPLOY &amp; STUDY</text><text x="800" y="808" text-anchor="middle" class="body">Programmatic computer-aided ethics in institutions</text></g>
<g><rect class="support" x="35" y="315" width="300" height="135" rx="8"/><text x="185" y="356" text-anchor="middle" class="head" font-size="25">Alethic-ISM</text><text x="185" y="388" text-anchor="middle" class="small">General technical infrastructure</text><text x="185" y="417" text-anchor="middle" class="small">Standalone systems/workflows paper</text><text x="185" y="482" text-anchor="middle" class="italic">historical / architectural contribution</text><path d="M335 382L430 350" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
<rect class="support" x="1265" y="445" width="300" height="135" rx="8"/><text x="1415" y="486" text-anchor="middle" class="head" font-size="25">Bioethics Bench</text><text x="1415" y="518" text-anchor="middle" class="small">Computational-bioethics research resource</text><text x="1415" y="547" text-anchor="middle" class="small">Standalone resource / benchmark paper</text><text x="1415" y="612" text-anchor="middle" class="italic">standardized objects / tasks used in validation</text><path d="M1265 512L1170 495" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/></g>
<text x="800" y="910" text-anchor="middle" class="head" font-size="22">Solid arrows = core program sequence. Dashed arrows = enabling/supporting relationship, not conceptual dependence.</text>
</svg>